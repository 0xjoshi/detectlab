scenario_id: SCN-009
name: Password Spraying Repeated Users
description: >
  Verify that six failed authentication events involving only
  three distinct users do not trigger DET-003.
expected_rule_id: DET-003
expected_host: WIN11-LAB
expected_detection: false

events:
