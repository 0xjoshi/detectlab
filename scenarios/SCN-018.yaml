scenario_id: SCN-018
name: SSH Failures Missing Source IP
description: >
  Verify that SSH authentication failures without a source IP
  do not trigger DET-002, which groups events by host and source IP.
expected_rule_id: DET-002
expected_host: UBUNTU-LAB
expected_detection: false

