scenario_id: SCN-016
name: Successful Logins Do Not Trigger Password Spraying Rule
description: >
  Verify that successful login events for multiple users do not
  trigger DET-003, which detects failed logins across distinct accounts.
expected_rule_id: DET-003
expected_host: WIN11-LAB
expected_detection: false

events:
