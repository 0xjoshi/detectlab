scenario_id: SCN-022
name: Password Spraying Exact Window Boundary
description: >
  Verify that an authentication failure exactly 300 seconds
  before evaluation is excluded from DET-003's time window.
expected_rule_id: DET-003
expected_host: WIN11-LAB
expected_detection: false

