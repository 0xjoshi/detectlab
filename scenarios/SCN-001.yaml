scenario_id: SCN-001
name: Multiple Failed Logins
description: >
  Verify that three or more authentication failures for the
  same user trigger the expected detection.
expected_rule_id: DET-001
expected_host: WIN11-LAB

events:
  - seconds_before_evaluation: 50
    event_type: authentication_failure
    event_data:
      user: scenario-test-user
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 40
    event_type: authentication_failure
    event_data:
      user: scenario-test-user
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 30
    event_type: authentication_failure
    event_data:
      user: scenario-test-user
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 20
    event_type: authentication_failure
    event_data:
      user: scenario-test-user
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 10
    event_type: authentication_failure
    event_data:
      user: scenario-test-user
      status: failure
    raw_event:
      source: scenario-library
