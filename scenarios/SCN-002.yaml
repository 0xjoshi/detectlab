scenario_id: SCN-002
name: SSH Brute Force From Single Source
description: >
  Verify that ten failed SSH logins from the same source IP within
  120 seconds trigger the expected detection.
expected_rule_id: DET-002
expected_host: UBUNTU-LAB

events:
