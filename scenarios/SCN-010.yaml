scenario_id: SCN-010
name: Password Spraying Outside Time Window
description: >
  Verify that five distinct users failing authentication from
  the same source IP over more than 300 seconds do not trigger DET-003.
expected_rule_id: DET-003
expected_host: WIN11-LAB
expected_detection: false

events:
  - seconds_before_evaluation: 400
    event_type: authentication_failure
    event_data:
      user: alice
      source_ip: 198.51.100.77
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 320
    event_type: authentication_failure
    event_data:
      user: bob
      source_ip: 198.51.100.77
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 240
    event_type: authentication_failure
    event_data:
      user: carol
      source_ip: 198.51.100.77
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 160
    event_type: authentication_failure
    event_data:
      user: dave
      source_ip: 198.51.100.77
      status: failure
    raw_event:
      source: scenario-library

  - seconds_before_evaluation: 80
    event_type: authentication_failure
    event_data:
      user: erin
      source_ip: 198.51.100.77
      status: failure
    raw_event:
      source: scenario-library
