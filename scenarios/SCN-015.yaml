scenario_id: SCN-015
name: Successful SSH Logins Do Not Trigger Brute Force Rule
description: >
  Verify that successful SSH logins do not trigger DET-002,
  which detects repeated failed SSH authentication attempts.
expected_rule_id: DET-002
expected_host: UBUNTU-LAB
expected_detection: false

