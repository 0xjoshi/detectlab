scenario_id: SCN-006
name: SSH Brute Force Below Threshold
description: >
  Verify that nine failed SSH logins from the same source IP
  against the same host within 120 seconds do not trigger DET-002.
expected_rule_id: DET-002
expected_host: UBUNTU-LAB
expected_detection: false

events:
