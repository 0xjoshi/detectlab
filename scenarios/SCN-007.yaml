scenario_id: SCN-007
name: SSH Brute Force Outside Time Window
description: >
  Verify that ten failed SSH logins from the same source IP
  spread across more than 120 seconds do not trigger DET-002.
expected_rule_id: DET-002
expected_host: UBUNTU-LAB
expected_detection: false

